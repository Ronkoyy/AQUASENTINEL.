<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map - AquaSentinel</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-view">
        <div class="mobile-app-header">
            <button class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
            <span style="font-weight: 800; font-size: 1.2rem;">AquaSentinel</span>
        </div>
        <div class="sidebar-overlay"></div>

        <aside id="sidebar">
            <div class="sidebar-header">
                <span><i class="fa-solid fa-water"></i> AquaSentinel</span>
                <i class="fa-solid fa-xmark close-sidebar-btn"></i>
            </div>
            <div class="sidebar-user">
                <div class="user-avatar" id="user-initials">JD</div>
                <!-- Profile Pic Tag -->
                <img src="" id="sidebar-user-img" class="user-avatar-img hidden-section" alt="User">
                <div><div id="user-name-display">Juan</div><div style="color: #4ade80; font-size: 0.8rem;">● Active</div></div>
            </div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="menu-btn"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
                <a href="map.html" class="menu-btn active-nav"><i class="fa-solid fa-map-location-dot"></i> Coastal Map</a>
                <a href="report.html" class="menu-btn"><i class="fa-solid fa-pen-to-square"></i> Submit Report</a>
                <a href="profile.html" class="menu-btn"><i class="fa-solid fa-user"></i> My Profile</a>
                <button onclick="app.logout()" class="menu-btn logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </nav>
        </aside>

        <main>
            <section id="section-map" class="content-section">
                <h2 class="page-title">Coastal Surveillance Map</h2>
                <div class="card map-card">
                    <div id="map"></div>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
