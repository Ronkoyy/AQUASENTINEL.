<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard -AquaSentinel</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-view">
        <div class="mobile-app-header">
            <button class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
            <span style="font-weight: 800; font-size: 1.2rem;">AquaSentinel</span>
        </div>
        <div class="sidebar-overlay"></div>
        <aside id="sidebar">
            <div class="sidebar-header"><span><i class="fa-solid fa-water"></i> AquaSentinel</span><i class="fa-solid fa-xmark close-sidebar-btn"></i></div>
            <div class="sidebar-user">
                <div class="user-avatar" id="user-initials">JD</div>
                <img src="" id="sidebar-user-img" class="user-avatar-img hidden-section" alt="User">
                <div><div id="user-name-display">Juan</div><div style="color: #4ade80; font-size: 0.8rem;">● Active</div></div>
            </div>
            <nav class="nav-menu">
                <a href="dashboard.html" class="menu-btn active-nav"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
                <a href="map.html" class="menu-btn"><i class="fa-solid fa-map-location-dot"></i> Coastal Map</a>
                <a href="report.html" class="menu-btn"><i class="fa-solid fa-pen-to-square"></i> Submit Report</a>
                <a href="profile.html" class="menu-btn"><i class="fa-solid fa-user"></i> My Profile</a>
                <button onclick="app.logout()" class="menu-btn logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </nav>
        </aside>
        <main>
            <section id="section-dashboard" class="content-section">
                <h2 class="page-title">Live Mission Status</h2>
                <div class="grid-3">
                    <div class="card weather-widget"><div style="position: relative; z-index: 2;"><h3 class="widget-title"><i class="fa-solid fa-location-dot"></i> COASTAL MONITOR</h3><div class="weather-flex"><i class="fa-solid fa-cloud-sun weather-icon"></i><div><span class="weather-temp">28°C</span><div class="weather-loc">Manolo Fortich</div></div></div></div></div>
                    <div class="card stat-card red"><div><div class="stat-label">Pollution</div><div class="stat-value" id="stat-pollution">0</div></div><div class="stat-icon bg-red-light"><i class="fa-solid fa-trash-can"></i></div></div>
                    <div class="card stat-card teal"><div><div class="stat-label">Sightings</div><div class="stat-value" id="stat-marine">0</div></div><div class="stat-icon bg-teal-light"><i class="fa-solid fa-fish"></i></div></div>
                </div>
                <div class="grid-2">
                    <div class="card"><h3 class="card-title">Waste Analysis</h3><div class="chart-container"><canvas id="wasteChart"></canvas></div></div>
                    <div class="card"><h3 class="card-title">Recent Activity</h3><div id="activity-feed" class="feed-container"></div></div>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
